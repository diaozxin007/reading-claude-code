[book]
title = "Reading Claude Code, Together"
description = "A deep dive into the design of Claude Code's tool primitives — what each tool is preventing"
authors = ["diaozxin007"]
language = "en"
src = "src"

[rust]
edition = "2021"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/diaozxin007/reading-claude-code"
edit-url-template = "https://github.com/diaozxin007/reading-claude-code/edit/main/en/src/{path}"
site-url = "/reading-claude-code/en/"

[output.html.fold]
enable = true
level = 0

[output.html.playground]
runnable = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
