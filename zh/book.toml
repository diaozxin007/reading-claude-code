[book]
title = "一同读 Claude Code"
description = "从 Tools、Agent Loop、Context 到 Memory，系统拆解 Claude Code 的内部机制与工程取舍"
authors = ["diaozxin007"]
language = "zh"
src = "src"

[rust]
edition = "2021"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/diaozxin007/reading-claude-code"
edit-url-template = "https://github.com/diaozxin007/reading-claude-code/edit/main/zh/src/{path}"
site-url = "/reading-claude-code/zh/"

[output.html.fold]
enable = true
level = 0

[output.html.playground]
runnable = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
